services:
  tracking-backend-store:
    container_name: mlflow_backend_store
    image: postgres:latest
    expose:
      - ${PG_PORT}
    networks:
      - backend
    environment:
        - POSTGRES_USER=${PG_USER}
        - POSTGRES_PASSWORD=${PG_PASSWORD}
        - POSTGRES_DATABASE=${PG_DATABASE}
    volumes:
      - .volumes/postgres:/var/lib/postgresql/
    healthcheck:
      test: ["CMD", "pg_isready", "-p", "${PG_PORT}", "-U", "${PG_USER}"]
      interval: 5s
      timeout: 5s
      retries: 3
    restart: always


  tracking-artifact-store:
    container_name: mlflow_artifact_store
    image: minio/minio
    ports:
      - "${MINIO_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    networks:
      - backend
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MINIO_ADDRESS=${MINIO_ADDRESS}
      - MINIO_PORT=${MINIO_PORT}
      - MINIO_STORAGE_USE_HTTPS=${MINIO_STORAGE_USE_HTTPS}
      - MINIO_CONSOLE_ADDRESS=${MINIO_CONSOLE_ADDRESS}
    volumes:
      - .volumes/minio:/data
    command: server /data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: always


  create_buckets:
    image: minio/mc
    container_name: minio_create_buckets
    depends_on:
      - tracking-artifact-store
    networks:
      - backend
    entrypoint: >
      /usr/bin/mc alias minio http://tracking-artifact-store:${MINIO_PORT} ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      /usr/bin/mc mb minio/${MLFLOW_BUCKET_NAME};
      /usr/bin/mc anonymous download minio/${MLFLOW_BUCKET_NAME};
      /usr/bin/mc admin accesskey create minio ${MINIO_ROOT_USER};


  tracking-server:
    container_name: mlflow_server
    image: ghcr.io/mlflow/mlflow:latest-full
    depends_on:
      - tracking-backend-store
      - tracking-artifact-store
    ports:
      - ${MLFLOW_PORT}:5000
    networks:
      - backend
    environment:
      - AWS_ACCESS_KEY_ID=${MINIO_ACCESS_KEY}
      - AWS_SECRET_ACCESS_KEY=${MINIO_SECRET_ACCESS_KEY}
      - MLFLOW_S3_ENDPOINT_URL=http://tracking-artifact-store:${MINIO_PORT}
      - MLFLOW_S3_IGNORE_TLS=true
    volumes:
      - .volumes/mlflow/mlartifacts:/mlartifacts
    command: >
      mlflow server
      --backend-store-uri postgresql://${PG_USER}:${PG_PASSWORD}@tracking-backend-store:${PG_PORT}/${PG_DATABASE}
      --host 0.0.0.0
      --serve-artifacts
      --artifacts-destination s3://${MLFLOW_BUCKET_NAME}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${MLFLOW_PORT}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always

networks:
  backend:
    driver: bridge