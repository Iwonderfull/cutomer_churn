[project]
name = "customer-churn"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "tii", email = "tii@hpclab.local" }
]
requires-python = ">=3.12"
dependencies = [
    "click>=8.3.1",
    "feast>=0.59.0",
    "mlflow>=3.9.0",
    "scikit-learn>=1.8.0",
    "xgboost>=3.1.3",
]

[project.scripts]
customer-churn = "customer_churn:main"

[build-system]
requires = ["uv_build>=0.8.3,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "imblearn>=0.0",
    "ipykernel>=7.1.0",
    "ipywidgets>=8.1.8",
    "pandas>=2.3.3",
    "setuptools>=80.10.2",
    "ydata-profiling>=4.18.1",
]
